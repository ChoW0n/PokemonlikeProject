kind = "web"
previewPath = "/"
title = "Pokemon Battle"
description = "A server-rendered Blazor battle game powered by the PokemonBattle .NET application."
version = "1.0.0"
id = "artifacts/pokemon-battle"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 3000

[services.development]
run = "dotnet run --project ../../PokemonBattle/PokemonBattle.csproj --no-launch-profile --urls http://0.0.0.0:3000"

[services.production.build]
args = [ "node", "-e", "const fs=require('fs');if(!fs.existsSync('artifacts/pokemon-battle/dotnet-app/PokemonBattle'))throw new Error('Missing bundled PokemonBattle runtime')" ]

[services.production.run]
args = [ "artifacts/pokemon-battle/dotnet-app/PokemonBattle", "--urls", "http://0.0.0.0:3000", "--contentRoot", "." ]

[services.production.run.env]
ASPNETCORE_ENVIRONMENT = "Production"
DOTNET_SYSTEM_GLOBALIZATION_INVARIANT = "1"

[services.production.health.startup]
path = "/healthz"

[services.env]
PORT = "3000"
BASE_PATH = "/"
