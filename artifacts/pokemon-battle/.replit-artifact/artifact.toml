kind = "web"
previewPath = "/"
title = "Pokemon Battle"
description = "A server-rendered Blazor battle game powered by the PokemonBattle .NET application."
version = "1.0.0"
id = "artifacts/pokemon-battle"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 3000

[services.development]
run = "dotnet run --project ../../PokemonBattle/PokemonBattle.csproj --no-launch-profile --urls http://0.0.0.0:3000"

[services.production.build]
args = [ "dotnet", "publish", "../../PokemonBattle/PokemonBattle.csproj", "-c", "Release", "-o", "../../PokemonBattle/publish", "--no-restore" ]

[services.production.run]
args = [ "dotnet", "../../PokemonBattle/publish/PokemonBattle.dll", "--urls", "http://0.0.0.0:3000" ]

[services.production.run.env]
ASPNETCORE_ENVIRONMENT = "Production"

[services.env]
PORT = "3000"
BASE_PATH = "/"
